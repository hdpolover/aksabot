name: aksabot

services:
  postgres:
    container_name: aksabot-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aksabot
      POSTGRES_PASSWORD: aksabot
      POSTGRES_DB: aksabot
    ports:
      - '5489:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: aksabot-redis
    image: redis:7-alpine
    ports:
      - '6312:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
