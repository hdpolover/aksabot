; PlatformIO Project Configuration
; Aksabot ESP32-S3 Firmware
;
; Board: ES3C28P (2.8" ESP32-S3 LCD Display)
;   https://www.lcdwiki.com/2.8inch_ESP32-S3_Display
;   Display: ILI9341V 240x320 SPI
;   Touch: FT6336G capacitive I2C
;   Audio: ES8311 codec + FM8002E amp (I2S)
;   SD: SDIO 4-bit
;   LED: WS2812B RGB

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug

; Flash and memory
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; PSRAM (AP_3v3 = OPI PSRAM with DIO flash)
board_build.arduino.memory_type = dio_opi

; ESP-IDF Kconfig overrides — fixes MBEDTLS_ERR_SSL_ALLOC_FAILED on WSS connect.
; These are real Kconfig options (not preprocessor defines).
; See sdkconfig.defaults for full explanation.
board_build.sdkconfig_path = sdkconfig.defaults

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE tuning — minimize RAM usage
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
    ; Broadcaster role needed for BLE advertising (provisioning + presence)
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=0
    ; Suppress deprecation warning from ArduinoWebsockets library (server.available()
    ; renamed to accept() in newer Arduino Network API — not our code to fix)
    -Wno-deprecated-declarations
    ; Suppress false-positive from GCC's analysis of Opus 1.3.1 SILK encoder macros
    ; (silk_NSQ / silk_NSQ_del_dec array size analysis is wrong — known GCC issue)
    -Wno-stringop-overread
    ; Hands-free (wake-word) mode. Set to 0 to disable — PTT only.
    ; Disabling stops continuous mic reads during idle, eliminates the I2S DMA backlog,
    ; and frees Core 0 for recording/playback without competition from the energy detector.
    -DHANDS_FREE_ENABLED=0
    ; Disable libopus internal assertions. With build_type=debug, arduino-libopus compiles
    ; with ENABLE_ASSERTIONS which turns celt_assert() into abort(). The pitch.c xcorr
    ; assertion fires because alloca() inside pitch_search() lands at 2-byte stack
    ; alignment under specific call-stack conditions. ESP32-S3 LX7 handles unaligned
    ; loads natively so the actual xcorr code is safe — only the assertion crashes us.
    -UENABLE_ASSERTIONS

; Pre-build: apply ArduinoWebsockets patches (setInsecure for ESP32)
extra_scripts = pre:patches/apply_patches.py

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload via built-in USB JTAG
upload_speed = 921600
upload_port = /dev/cu.usbmodem1301

lib_deps =
    ; Display driver (LovyanGFX — proper text + anti-aliased fonts on ESP32-S3)
    lovyan03/LovyanGFX@^1.2.0
    ; WebSocket client
    gilmaimon/ArduinoWebsockets@^0.5.4
    ; JSON parsing
    bblanchon/ArduinoJson@^7.3.0
    ; Opus codec for ESP32
    https://github.com/pschatzmann/arduino-libopus.git
    ; BLE — lightweight NimBLE stack for GATT server + presence scanning
    h2zero/NimBLE-Arduino@^2.1.2
    ; RGB LED (WS2812B) — uses RMT peripheral on ESP32-S3
    fastled/FastLED@^3.9.0
