; PlatformIO Project Configuration
; Aksabot ESP32-S3 Firmware
;
; Board: Hosyond ESP32-S3 N16R8 (16MB flash, 8MB PSRAM)
; Framework: Arduino + ESP-IDF components

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash and memory
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; PSRAM
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Wi-Fi credentials (Phase 1: hardcoded, Phase 4+: BLE provisioning)
    -DWIFI_SSID=\"${sysenv.AKSABOT_WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.AKSABOT_WIFI_PASS}\"
    ; Backend connection
    -DBACKEND_WS_URL=\"${sysenv.AKSABOT_WS_URL}\"
    -DDEVICE_TOKEN=\"${sysenv.AKSABOT_DEVICE_TOKEN}\"
    ; Audio config
    -DI2S_MIC_SAMPLE_RATE=16000
    -DI2S_MIC_BCLK=5
    -DI2S_MIC_WS=6
    -DI2S_MIC_DATA=7
    -DI2S_SPK_BCLK=15
    -DI2S_SPK_WS=16
    -DI2S_SPK_DATA=17
    ; SPI bus (shared: display, touch, SD)
    -DSPI_CLK=12
    -DSPI_MOSI=11
    -DSPI_MISO=13
    -DSD_CS=10
    ; Opus codec
    -DOPUS_FRAME_MS=20
    -DOPUS_BITRATE=16000

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload
upload_speed = 921600

; Dependencies
lib_deps =
    ; WebSocket client
    gilmaimon/ArduinoWebsockets@^0.5.4
    ; JSON parsing
    bblanchon/ArduinoJson@^7.3.0
    ; Opus codec for ESP32
    https://github.com/pschatzmann/arduino-libopus.git
