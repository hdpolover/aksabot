; PlatformIO Project Configuration
; Aksabot ESP32-S3 Firmware
;
; Board: ES3C28P (2.8" ESP32-S3 LCD Display)
;   https://www.lcdwiki.com/2.8inch_ESP32-S3_Display
;   Display: ILI9341V 240x320 SPI
;   Touch: FT6336G capacitive I2C
;   Audio: ES8311 codec + FM8002E amp (I2S)
;   SD: SDIO 4-bit
;   LED: WS2812B RGB

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug

; Flash and memory
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; PSRAM (AP_3v3 = OPI PSRAM with DIO flash)
board_build.arduino.memory_type = dio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Wi-Fi and backend credentials are in include/credentials.h (git-ignored)
    ; See credentials.h.example for the template
    ; Display configured via lgfx_config.h (LovyanGFX runtime config)

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload via built-in USB JTAG
upload_speed = 921600
upload_port = /dev/cu.usbmodem101

; Dependencies
lib_deps =
    ; Display driver (LovyanGFX — proper text + anti-aliased fonts on ESP32-S3)
    lovyan03/LovyanGFX@^1.2.0
    ; WebSocket client
    gilmaimon/ArduinoWebsockets@^0.5.4
    ; JSON parsing
    bblanchon/ArduinoJson@^7.3.0
    ; Opus codec for ESP32
    https://github.com/pschatzmann/arduino-libopus.git
