name: aksabot

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aksabot-app
    restart: unless-stopped
    ports:
      - '4280:4280'
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-aksabot}
      DB_PASSWORD: ${DB_PASSWORD:-aksabot}
      DB_NAME: ${DB_NAME:-aksabot}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # App
      PORT: 4280
      NODE_ENV: production
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      # AI providers
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Google Cloud — pass service account JSON as base64 env var.
      # The entrypoint script decodes it to a file at startup.
      GCLOUD_SA_BASE64: ${GCLOUD_SA_BASE64:-}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-sa.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4280/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: aksabot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aksabot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aksabot}
      POSTGRES_DB: ${DB_NAME:-aksabot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-aksabot}']
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aksabot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
