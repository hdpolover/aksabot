<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aksabot Face Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #0a0a0f;
      color: #e0e0e0;
      display: flex;
      min-height: 100vh;
      padding: 24px;
      gap: 24px;
    }

    /* Left: display */
    .display-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .display-frame {
      border: 2px solid #333;
      border-radius: 12px;
      padding: 8px;
      background: #111;
      box-shadow: 0 0 30px rgba(0,255,255,0.05);
    }
    #display {
      display: block;
      border-radius: 4px;
      image-rendering: pixelated;
      width: 360px;   /* 1.5x scale */
      height: 480px;
    }
    .display-label {
      font-size: 11px;
      color: #555;
      text-align: center;
    }

    /* Right: controls */
    .controls-col {
      flex: 1;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 18px;
      color: #0ff;
      font-weight: 600;
    }

    .section {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px;
    }
    .section h2 {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 2px;
    }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      background: #1a1a25;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12px;
      margin-bottom: 8px;
    }
    input:focus { outline: 1px solid #0ff; border-color: #0ff; }

    select {
      width: 100%;
      background: #1a1a25;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12px;
    }

    button {
      background: #1a1a30;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { background: #252540; border-color: #0ff; }
    button:active { background: #0ff; color: #000; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.recording { background: #f33; border-color: #f55; color: #fff; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-row button { flex: 1; min-width: 80px; }

    .btn-primary {
      background: #0ff;
      color: #000;
      font-weight: 600;
      border-color: #0ff;
    }
    .btn-primary:hover { background: #00cccc; }

    .btn-danger {
      border-color: #f55;
      color: #f55;
    }
    .btn-danger:hover { background: #331515; }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .status-on { color: #0f0; }
    .status-on::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #0f0; }
    .status-off { color: #f55; }
    .status-off::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #f55; }

    #log {
      background: #0a0a10;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 8px;
      font-size: 10px;
      color: #666;
      height: 140px;
      overflow-y: auto;
      line-height: 1.5;
    }
    #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="display-col">
    <div class="display-frame">
      <canvas id="display"></canvas>
    </div>
    <div class="display-label">240 x 320 &mdash; ILI9341 TFT</div>
  </div>

  <div class="controls-col">
    <h1>Aksabot Face Simulator</h1>

    <!-- Connection -->
    <div class="section">
      <h2>Backend Connection</h2>
      <div class="status-indicator">
        <span id="ws-status" class="status-off">Disconnected</span>
      </div>
      <form id="connect-form" style="margin-top: 8px;">
        <label>Backend URL</label>
        <input type="text" id="backend-url" value="http://localhost:4280" />
        <label>Email</label>
        <input type="email" id="email" value="test@aksabot.local" />
        <label>Password</label>
        <input type="password" id="password" value="TestPass123!" />
        <div class="btn-row" style="margin-top: 4px;">
          <button type="submit" id="connect-btn" class="btn-primary">Connect</button>
          <button type="button" id="disconnect-btn" class="btn-danger">Disconnect</button>
        </div>
      </form>
    </div>

    <!-- Expression -->
    <div class="section">
      <h2>Expression</h2>
      <select id="expr-select">
        <!-- populated by JS -->
      </select>
    </div>

    <!-- Simulate -->
    <div class="section">
      <h2>Simulate</h2>
      <div class="btn-row">
        <button id="btn-speak">Hold to Speak</button>
        <button id="btn-arrive">Arrive</button>
        <button id="btn-depart">Depart</button>
        <button id="btn-dismiss">Dismiss</button>
      </div>
    </div>

    <!-- Log -->
    <div class="section" style="flex: 1;">
      <h2>Event Log</h2>
      <div id="log"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
